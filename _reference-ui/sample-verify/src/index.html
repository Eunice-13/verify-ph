<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerifyPH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;0,900;1,700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=open-sauce-one@400,500,600,700&display=swap" rel="stylesheet">
  <link href="./output.css" rel="stylesheet">
</head>
<body class="bg-[#f4f1ea] font-sans text-neutral-800 min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-emerald-900 text-white">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <button type="button" data-nav="home" class="cursor-pointer flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="w-7 h-7">
          <path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3Z" stroke-linejoin="round"/>
          <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="font-serif font-bold text-xl">VerifyPH</span>
        <span class="hidden sm:inline text-white/40">|</span>
        <span id="header-date" class="hidden sm:inline font-sans text-sm text-white/90"></span>
      </button>

      <div class="flex items-center gap-4">
        <div class="relative">
          <button type="button" id="hamburger-btn" aria-label="Open menu" class="cursor-pointer p-1">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6">
              <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/>
            </svg>
          </button>

          <!-- Small popup dropdown showing Claim Checker + categories -->
          <div
            id="nav-dropdown"
            class="hidden absolute right-0 top-full mt-2 w-64 bg-white rounded-xl shadow-xl border border-neutral-200 text-neutral-800 py-2 z-50 dropdown-anim"
          >
            <button type="button" data-nav="claim-checker" class="cursor-pointer w-full text-left px-4 py-2 font-serif font-bold text-sm hover:bg-neutral-100">Claim Checker</button>
            <button type="button" data-nav="category" data-category="NEWS & POLITICS" class="cursor-pointer w-full text-left px-4 py-2 font-serif font-bold text-sm hover:bg-neutral-100">News &amp; Politics</button>
            <button type="button" data-nav="category" data-category="ECONOMY" class="cursor-pointer w-full text-left px-4 py-2 font-serif font-bold text-sm hover:bg-neutral-100">Economy</button>
            <button type="button" data-nav="category" data-category="HEALTH & SAFETY" class="cursor-pointer w-full text-left px-4 py-2 font-serif font-bold text-sm hover:bg-neutral-100">Health &amp; Safety</button>
            <button type="button" data-nav="category" data-category="LIFESTYLE" class="cursor-pointer w-full text-left px-4 py-2 font-serif font-bold text-sm hover:bg-neutral-100">Lifestyle</button>
            <button type="button" data-nav="category" data-category="GENERAL" class="cursor-pointer w-full text-left px-4 py-2 font-serif font-bold text-sm hover:bg-neutral-100">General</button>
            <div class="mt-2 pt-2 border-t border-neutral-200 px-4 flex items-center gap-3 text-neutral-500">
              <a href="#" aria-label="Facebook" class="cursor-pointer w-7 h-7 rounded-full border border-neutral-300 flex items-center justify-center hover:bg-neutral-100 hover:text-emerald-900 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5">
                  <path d="M22 12.06C22 6.51 17.52 2 12 2S2 6.51 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.8c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.47h-1.26c-1.24 0-1.63.78-1.63 1.58v1.9h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94Z"/>
                </svg>
              </a>
              <a href="#" aria-label="X (Twitter)" class="cursor-pointer w-7 h-7 rounded-full border border-neutral-300 flex items-center justify-center hover:bg-neutral-100 hover:text-emerald-900 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5">
                  <path d="M18.9 2h3.3l-7.2 8.2L23.5 22h-6.8l-5.3-6.9L5 22H1.7l7.7-8.8L1 2h6.9l4.8 6.3L18.9 2Zm-2.4 18h1.8L8.6 4H6.7l9.8 16Z"/>
                </svg>
              </a>
              <a href="#" aria-label="Instagram" class="cursor-pointer w-7 h-7 rounded-full border border-neutral-300 flex items-center justify-center hover:bg-neutral-100 hover:text-emerald-900 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-3.5 h-3.5">
                  <rect x="3" y="3" width="18" height="18" rx="5"/>
                  <circle cx="12" cy="12" r="4"/>
                  <circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none"/>
                </svg>
              </a>
              <a href="#" aria-label="TikTok" class="cursor-pointer w-7 h-7 rounded-full border border-neutral-300 flex items-center justify-center hover:bg-neutral-100 hover:text-emerald-900 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5">
                  <path d="M16.6 2h-3.2v13.2a2.9 2.9 0 1 1-2.4-2.86V9.06a6.1 6.1 0 1 0 5.6 6.08V8.4a7.3 7.3 0 0 0 4.4 1.5V6.7a4.3 4.3 0 0 1-4.4-4.7Z"/>
                </svg>
              </a>
              <span class="text-xs font-sans text-neutral-500 whitespace-nowrap">— Support VerifyPH</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Sub-navigation (pinned directly under the header) -->
  <nav class="sticky top-16 z-30 bg-[#e3dfd7]">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between overflow-x-auto">
      <button type="button" data-nav="category" data-category="NEWS & POLITICS" class="cursor-pointer font-serif font-bold text-sm md:text-base text-neutral-800 whitespace-nowrap hover:text-emerald-900">NEWS &amp; POLITICS</button>
      <button type="button" data-nav="category" data-category="ECONOMY" class="cursor-pointer font-serif font-bold text-sm md:text-base text-neutral-800 whitespace-nowrap hover:text-emerald-900">ECONOMY</button>
      <button type="button" data-nav="category" data-category="HEALTH & SAFETY" class="cursor-pointer font-serif font-bold text-sm md:text-base text-neutral-800 whitespace-nowrap hover:text-emerald-900">HEALTH &amp; SAFETY</button>
      <button type="button" data-nav="category" data-category="LIFESTYLE" class="cursor-pointer font-serif font-bold text-sm md:text-base text-neutral-800 whitespace-nowrap hover:text-emerald-900">LIFESTYLE</button>
      <button type="button" data-nav="category" data-category="GENERAL" class="cursor-pointer font-serif font-bold text-sm md:text-base text-neutral-800 whitespace-nowrap hover:text-emerald-900">GENERAL</button>
    </div>
  </nav>

  <!-- SPA mount point -->
  <main id="app"></main>

  <!-- Floating / locking claim-checker input bar (home + category pages) -->
  <div id="floating-claim-bar" class="hidden claim-bar-fixed">
    <form id="floating-claim-form" class="flex items-center gap-3 bg-white rounded-3xl border-2 border-transparent shadow-[0_6px_18px_rgba(0,0,0,0.15)] px-5 py-3 max-w-2xl mx-auto claim-input-wrap transition-all duration-200">
      <textarea
        id="floating-claim-input"
        rows="1"
        placeholder="Paste a claim, headline, or link to fact-check…"
        class="flex-1 bg-transparent outline-none font-sans text-sm text-neutral-700 placeholder:text-neutral-400 resize-none max-h-40 overflow-y-auto leading-relaxed self-center"
      ></textarea>
      <button
        type="submit"
        aria-label="Submit claim"
        class="cursor-pointer shrink-0 w-8 h-8 rounded-full border border-neutral-300 flex items-center justify-center text-neutral-600 hover:bg-neutral-100 transition-colors self-center"
      >
        +
      </button>
    </form>
    <div id="floating-claim-result-slot" class="max-w-2xl mx-auto mt-3"></div>
  </div>

  <script>
    document.getElementById("header-date").textContent = new Date().toLocaleDateString("en-US", {
      year: "numeric",
      month: "long",
      day: "numeric",
    });
  </script>
  <script src="./main.js"></script>
</body>
</html>
